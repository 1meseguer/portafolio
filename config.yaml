baseURL: https://1meseguer.github.io/portafolio
languageCode: es-es
title: Mi portafolio
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
minify: true

params:
  env: production
  title: Mi Portafolio
  description: Mi portafolio de programación
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10

outputs:
  home:
    - HTML
    - RSS
    - JSON